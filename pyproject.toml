[project]
name = "connexion"
version = "3.0.dev0"
description = "Connexion - API first applications with OpenAPI/Swagger"
readme = "README.md"
keywords = [
    "api",
    "swagger",
    "openapi",
]
license = {text = "Apache-2.0"}
authors = [
    { name = "Robbe Sneyders", email = "robbe.sneyders@gmail.com" },
    { name = "Ruwan Lambrichts", email = "ruwan.lambrichts@ml6.eu" },
    { name = "Daniel Grossmann-Kavanagh", email = "me@danielgk.com" },
    { name = "Henning Jacobs", email = "henning.jacobs@zalando.de" },
    { name = "João Santos", email = "joao.santos@zalando.de" },
]
maintainers = [
    { name = "Robbe Sneyders", email = "robbe.sneyders@gmail.com" },
    { name = "Ruwan Lambrichts", email = "ruwan.lambrichts@ml6.eu" },
]
repository = "https://github.com/spec-first/connexion"
include = ["*.txt", "*.rst"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.8"
dependencies = [
    "asgiref>=3.4",
    "httpx>=0.23",
    "inflection>=0.3.1",
    "jsonschema>=4.17.3",
    "Jinja2>=3.0.0",
    "python-multipart>=0.0.15",
    "PyYAML>=5.1",
    "requests>=2.27",
    "starlette>=0.35",
    "typing-extensions>=4.6.1",
    "werkzeug>=2.2.1",
]


[project.optional-dependencies]
flask = [
    "a2wsgi>=1.7",
    "flask[async]>=2.2",
]
swagger-ui = [
    "swagger-ui-bundle>=1.1.0",
]
uvicorn = [
    "uvicorn[standard]>=0.17.6",
]
mock = [
    "jsf>=0.10.0",
]

[project.urls]
repository = "https://github.com/spec-first/connexion"

[project.scripts]
connexion = 'connexion.cli:main'

[dependency-groups]
tests = [
    "pre-commit~=2.21.0",
    "pytest==7.2.1",
    "pytest-asyncio~=0.18.3",
    "pytest-cov~=2.12.1",
]
docs = [
    "sphinx==5.3.0",
    "sphinx-copybutton==0.5.2",
    "sphinx-design==0.4.1",
    "sphinx-rtd-theme==1.2.0",
    "sphinxemoji==0.2.0",
]

[tool.pdm.build]
includes = ["*.txt", "*.rst"]
[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.distutils.bdist_wheel]
universal = true

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:connexion.*:",
    "ignore::FutureWarning:connexion.*:",
]
asyncio_mode = "auto"

[tool.isort]
profile = "black"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if t.TYPE_CHECKING:",
    "@t.overload",
]

[[tool.mypy.overrides]]
module = "referencing.jsonschema.*"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "referencing._core.*"
follow_imports = "skip"
